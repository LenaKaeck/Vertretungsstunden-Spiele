<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kinderzimmer-Escape</title>
<style>
:root{--y:#ffc928;--yd:#c99a00;--b:#1d5fd1;--ink:#222}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Verdana,Arial,sans-serif;background:#111;color:#fff;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
svg text{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}

/* ===== 3D-Raum ===== */
#view{position:absolute;inset:0;overflow:hidden;background:#000;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
#vig{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(10,5,25,.55) 100%)}
#scene{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.face{position:absolute;left:-600px;top:-600px;width:1200px;height:1200px;backface-visibility:hidden}
.face svg{width:100%;height:100%;display:block}
.hs{position:absolute;border:0;background:transparent;border-radius:18px;padding:0}
.hs:hover{outline:8px solid rgba(255,235,120,.75)}
.hs i{position:absolute;right:-10px;top:-24px;font-style:normal;font-size:64px;animation:tw 1.6s ease-in-out infinite;pointer-events:none}
.hs.hint{animation:hintp 1s ease-in-out infinite;outline:10px solid rgba(255,235,120,.9)}
@keyframes tw{0%,100%{transform:scale(.8) rotate(-10deg);opacity:.7}50%{transform:scale(1.2) rotate(10deg);opacity:1}}
@keyframes hintp{0%,100%{box-shadow:0 0 0 0 rgba(255,235,120,.0)}50%{box-shadow:0 0 70px 30px rgba(255,235,120,.8)}}

/* ===== Oberfläche ===== */
.ui{position:absolute;z-index:5}
#top{left:10px;right:10px;top:10px;display:flex;gap:10px;align-items:stretch}
#obj{flex:1;background:#fff;color:var(--ink);border:4px solid #222;border-radius:18px;padding:8px 14px;font-weight:700;font-size:clamp(16px,2.8vmin,26px);line-height:1.25;display:flex;align-items:center;gap:10px}
#obj b{background:var(--y);border-radius:10px;padding:2px 8px;white-space:nowrap;font-size:.8em}
.rb{width:56px;height:56px;border-radius:50%;border:0;background:#1d5fd1;color:#fff;font-size:26px;flex:none;box-shadow:0 4px 0 #123f94}
.rb.dk{background:#2b3066;box-shadow:0 4px 0 #14173a}
#inv{left:10px;bottom:10px;display:flex;gap:8px;align-items:center;background:rgba(15,18,50,.85);padding:8px 10px;border-radius:18px;border:3px solid #444a80}
.is{width:clamp(36px,6.5vmin,56px);height:clamp(36px,6.5vmin,56px);border-radius:12px;background:#222645;border:3px solid #555;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(22px,4.4vmin,34px);color:#778}
.is.got{background:var(--y);color:#222;border-color:#fff;animation:pop .5s}
#map{right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,clamp(38px,6.5vmin,56px));grid-template-rows:repeat(3,clamp(38px,6.5vmin,56px));gap:5px;background:rgba(15,18,50,.85);padding:8px;border-radius:18px;border:3px solid #444a80}
#map button{border:0;border-radius:12px;background:#2b3066;font-size:clamp(18px,3.6vmin,28px);color:#fff;padding:0}
#map button.here{background:var(--y);box-shadow:0 0 0 3px #fff}
#map button.hint{animation:pulse 1s infinite}
#map .c{display:flex;align-items:center;justify-content:center;font-size:12px;color:#aab;text-align:center}
.arrow{top:50%;margin-top:-34px;width:64px;height:84px;border-radius:20px;border:0;background:rgba(15,18,50,.7);color:#fff;font-size:34px}
#al{left:6px}#ar{right:6px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.shake{animation:shake .35s}
#help{left:50%;transform:translateX(-50%);bottom:12px;background:rgba(15,18,50,.8);padding:8px 16px;border-radius:30px;font-size:clamp(13px,2.2vmin,18px);border:2px solid #444a80;white-space:nowrap;pointer-events:none;transition:opacity 1s}

/* ===== Fenster / Rätsel ===== */
#modal{position:absolute;inset:0;z-index:20;background:rgba(10,10,30,.8);display:none;align-items:center;justify-content:center;padding:12px}
#modal.on{display:flex}
.panel{background:#fff8e6;color:var(--ink);border:5px solid #222;border-radius:26px;padding:clamp(12px,2.6vmin,24px);width:min(100%,820px);max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vmin,18px);text-align:center;position:relative}
.panel h2{margin:0;font-size:clamp(22px,4.4vmin,36px)}
.say{font-weight:700;font-size:clamp(20px,3.6vmin,32px);line-height:1.3}
.say .spk{margin-left:8px;vertical-align:middle;width:46px;height:46px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:22px}
.close{position:absolute;right:10px;top:10px;width:48px;height:48px;border-radius:50%;border:0;background:#ddd;font-size:22px}
.btn{min-height:60px;border:0;border-radius:20px;padding:10px 26px;font-weight:700;font-size:clamp(20px,3.4vmin,30px);background:var(--y);color:#222;box-shadow:0 6px 0 var(--yd)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--yd)}
.note{background:#fff59d;border:3px solid #c9b800;border-radius:8px;padding:14px 18px;transform:rotate(-1deg);box-shadow:0 6px 0 rgba(0,0,0,.15);max-width:640px}
.pic{font-size:clamp(60px,15vmin,120px);line-height:1}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.opt,.tile{min-width:clamp(80px,16vmin,150px);min-height:clamp(64px,11vmin,96px);border:0;border-radius:20px;font-weight:700;font-size:clamp(26px,5.4vmin,46px);padding:6px 16px}
.opt{background:#fff;border:3px solid #222;box-shadow:0 6px 0 #999}
.opt.ok{background:#8fe3a4}.opt.no{background:#ffb3ae;opacity:.6}
.tile{background:var(--y);box-shadow:0 6px 0 var(--yd);color:#222}
.tile:disabled{opacity:.25}
.sl{min-width:clamp(80px,16vmin,150px);min-height:clamp(64px,11vmin,96px);border:5px dashed #99a;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(26px,5.4vmin,46px);background:#eef}
.sl.f{border-style:solid;border-color:var(--y);background:#fff}
.sl .pc{font-size:clamp(40px,9vmin,70px)}
.s1{color:#1d5fd1}.s2{color:#d6312b}
.dots{display:flex;gap:8px}.dots i{width:14px;height:14px;border-radius:50%;background:#ccc}.dots i.on{background:#f5a300}
.dark{position:relative;width:100%;height:clamp(180px,38vh,300px);border-radius:20px;background:#0a0a1c;border:4px solid #444a80;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:12px;touch-action:none;--x:50%;--y:50%}
.dark .mask{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle clamp(80px,15vmin,130px) at var(--x) var(--y),rgba(0,0,8,0) 0,rgba(0,0,8,0) 55%,rgba(0,0,8,.985) 100%)}
.dark .line{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:center}
.dark .wd{border:0;background:transparent;color:#fff6c4;font-weight:700;font-size:clamp(26px,6.4vmin,52px);padding:2px 8px;border-radius:12px;position:relative;z-index:1}
.dark .wd.found{z-index:3;background:#ffe066;color:#222}
.bigl{width:clamp(90px,20vmin,150px);height:clamp(90px,20vmin,150px);border-radius:24px;background:var(--y);color:#222;font-weight:700;font-size:clamp(60px,14vmin,110px);display:flex;align-items:center;justify-content:center;border:5px solid #222;animation:pop .6s}
.stars{width:100%;max-height:44vh;background:#1b1f55;border-radius:20px;border:4px solid #444a80}
.stars polygon{cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.stars polygon:hover{transform:scale(1.12)}
.conf{font-size:clamp(34px,7vmin,60px);letter-spacing:8px}
.start h1{margin:0;font-size:clamp(30px,6.4vmin,54px)}
</style>
</head>
<body>
<div id="view"></div>

<div id="vig"></div>
<div id="top" class="ui">
  <div id="obj"><b>Tipp</b><span id="objt"></span></div>
  <button class="rb" id="objs" title="Tipp vorlesen">🔊</button>
  <button class="rb dk" id="snd" title="Vorlesen an/aus">🔔</button>
</div>
<button class="ui arrow" id="al">◀</button>
<button class="ui arrow" id="ar">▶</button>
<div id="inv" class="ui"></div>
<div id="map" class="ui"></div>
<div id="help" class="ui">👆 Ziehe mit dem Finger, um dich umzuschauen</div>
<div id="modal"></div>

<script src="three.min.js"></script>
<script>
const $=(s,e=document)=>e.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);

/* ---------- Ton ---------- */
let speechOn=true,ac;
function say(t){if(!speechOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F000}-\u{1FFFF}☀-➿]/gu,''));u.lang='de-DE';u.rate=.75;speechSynthesis.speak(u)}
function beep(fs,d=.12){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*d;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)})}catch(e){}}
const good=()=>beep([523,659,784]),bad=()=>beep([260,200],.15),fanfare=()=>beep([523,659,784,1047,784,1047,1319],.14);
$('#snd').onclick=e=>{speechOn=!speechOn;e.target.textContent=speechOn?'🔔':'🔕';if(!speechOn)speechSynthesis&&speechSynthesis.cancel()};

/* ---------- Spielstand ---------- */
const WORD='MOND';
let S;
const newState=()=>({note:0,chest:0,cave:0,teddy:0,stars:0,door:0,flash:0,letters:0});
const OBJ=[
 ['note','Dreh dich um! An der Tür 🚪 hängt ein Zettel. Lies ihn.','note'],
 ['chest','Geh zur Spielzeugkiste 🧸 (links neben dem Bett) und öffne sie.','chest'],
 ['cave','Krabbel mit der Taschenlampe in die Deckenhöhle auf dem Hochbett 🛏️.','cave'],
 ['teddy','Der Teddy sitzt am Fenster 🪟. Weck ihn auf!','teddy'],
 ['stars','Schau hoch zur Decke ⭐. Dort leuchten Sterne.','stars'],
 ['door','Geh zur Tür 🚪 und setze das Lösungswort zusammen.','door']
];
const cur=()=>OBJ.find(o=>!S[o[0]]);
function refreshUI(){
  const c=cur();$('#objt').textContent=c?c[1]:'Du hast es geschafft!';
  const inv=$('#inv');inv.innerHTML='';
  inv.append(el('div','is'+(S.flash?' got':''),S.flash?'🔦':'?'));
  [...WORD].forEach((l,i)=>inv.append(el('div','is'+(i<S.letters?' got':''),i<S.letters?l:'?')));
  updateHint(false);
}
$('#objs').onclick=()=>{const c=cur();say(c?c[1]:'Du hast es geschafft!');poke()};

const STAR=(cx,cy,r)=>{let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(" ")};
/* ---------- 3D-Raum (three.js) ---------- */
const view=$('#view');
const R=2,H=2.6;                       // halbe Raumbreite, Raumhöhe (Meter)
let renderer,camera,scene3,glOK=true;
let hd=0,pt=-4;                        // Blickrichtung: hd = Grad nach rechts, pt = Grad nach oben
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ----- Texturen aus Canvas ----- */
function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}
  return t;
}
const woodTex=(base,dark,vertical,rep)=>canvasTex(512,512,(g,w,h)=>{
  g.fillStyle=base;g.fillRect(0,0,w,h);
  if(vertical){g.translate(w,0);g.rotate(Math.PI/2)}
  for(let i=0;i<150;i++){const y=rnd(0,h);g.strokeStyle=dark;g.globalAlpha=rnd(.05,.28);g.lineWidth=rnd(.6,3);g.beginPath();g.moveTo(rnd(-40,0),y);g.bezierCurveTo(w*.3,y+rnd(-6,6),w*.6,y+rnd(-6,6),w+40,y+rnd(-4,4));g.stroke()}
  g.globalAlpha=1;
},rep);
const plasterTex=(c,rep)=>canvasTex(512,512,(g,w,h)=>{
  g.fillStyle=c;g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){g.fillStyle=Math.random()<.5?'#000':'#fff';g.globalAlpha=rnd(.01,.05);g.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(1,3))}
  for(let i=0;i<24;i++){const x=rnd(0,w),y=rnd(0,h),r=rnd(40,110),gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(0,0,0,.035)');gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=1;g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
  g.globalAlpha=1;
},rep||[2,1.3]);
const parquetTex=()=>canvasTex(1024,1024,(g,w,h)=>{
  const rows=16,ph=h/rows;
  for(let r=0;r<rows;r++){const off=(r%2)*w/4;
    for(let c=-1;c<3;c++){const x=off+c*w/2,tn=rnd(0,1);
      g.fillStyle=`hsl(${28+tn*6},${42+tn*10}%,${50+tn*12}%)`;g.fillRect(x,r*ph,w/2,ph);
      for(let i=0;i<14;i++){g.strokeStyle='rgba(80,45,15,'+rnd(.05,.2)+')';g.lineWidth=rnd(.5,2);const y=r*ph+rnd(3,ph-3);g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+w*.15,y+rnd(-3,3),x+w*.3,y+rnd(-3,3),x+w/2,y+rnd(-2,2));g.stroke()}
      g.strokeStyle='rgba(50,28,8,.55)';g.lineWidth=2;g.strokeRect(x,r*ph,w/2,ph);
    }}
},[2,2]);
const rugTex=()=>canvasTex(1024,1024,(g,w)=>{
  const cols=['#e8786c','#f5c15a','#7ac28a','#6aaee0','#f3e6cc','#d98aa8','#ffffff'];const cx=w/2;let r=cx-4;
  cols.forEach(c=>{g.fillStyle=c;g.beginPath();g.arc(cx,cx,r,0,7);g.fill();r-=cx/7.3});
  g.globalAlpha=.5;g.strokeStyle='#fff';g.setLineDash([16,16]);g.lineWidth=5;[.64,.36].forEach(k=>{g.beginPath();g.arc(cx,cx,cx*k,0,7);g.stroke()});g.globalAlpha=1;
  for(let i=0;i<30000;i++){g.fillStyle=Math.random()<.5?'#000':'#fff';g.globalAlpha=rnd(.02,.09);g.fillRect(rnd(0,w),rnd(0,w),2,2)}
  g.globalAlpha=1;
});
const fabricTex=rep=>canvasTex(128,128,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.fillStyle='rgba(0,0,0,.09)';for(let i=0;i<w;i+=4){g.fillRect(i,0,1,h);g.fillRect(0,i,w,1)}},rep||[6,6]);
const nightTex=()=>canvasTex(1024,640,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#070d33');gr.addColorStop(.7,'#1f3478');gr.addColorStop(1,'#2d4a90');g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<170;i++){g.fillStyle='#fff';g.globalAlpha=rnd(.3,1);g.beginPath();g.arc(rnd(0,w),rnd(0,h*.7),rnd(.6,2),0,7);g.fill()}
  g.globalAlpha=1;const mx=w*.68,my=h*.3;const mg=g.createRadialGradient(mx,my,10,mx,my,190);mg.addColorStop(0,'rgba(255,250,210,.9)');mg.addColorStop(1,'rgba(255,250,210,0)');g.fillStyle=mg;g.fillRect(0,0,w,h);
  g.fillStyle='#fffbe0';g.beginPath();g.arc(mx,my,58,0,7);g.fill();g.fillStyle='#e8dc9c';g.beginPath();g.arc(mx+16,my+10,10,0,7);g.arc(mx-20,my-12,7,0,7);g.fill();
  g.fillStyle='#0b1235';g.beginPath();g.moveTo(0,h);g.lineTo(0,h*.78);for(let x=0;x<=w;x+=30)g.lineTo(x,h*.78-Math.abs(Math.sin(x*.013))*70-20);g.lineTo(w,h);g.fill();
  [[110,.84],[380,.86],[640,.82],[880,.85]].forEach(([x,y])=>{g.fillStyle='#070b27';g.fillRect(x,h*y-40,76,40+h*(1-y));g.beginPath();g.moveTo(x-6,h*y-40);g.lineTo(x+38,h*y-74);g.lineTo(x+82,h*y-40);g.fill();g.fillStyle='#ffd36b';g.fillRect(x+14,h*y-26,16,18);g.fillRect(x+46,h*y-26,16,18)});
});
const paperTex=()=>canvasTex(256,320,(g,w,h)=>{
  g.fillStyle='#fffbd2';g.fillRect(0,0,w,h);for(let i=0;i<3000;i++){g.fillStyle='#000';g.globalAlpha=rnd(.01,.04);g.fillRect(rnd(0,w),rnd(0,h),2,2)}g.globalAlpha=1;
  g.strokeStyle='#5d6f9c';g.lineWidth=5;g.lineCap='round';
  [[30,70,225],[30,115,215],[30,160,225],[30,205,200],[30,250,150]].forEach(([x,y,x2])=>{g.beginPath();g.moveTo(x,y);for(let k=x;k<x2;k+=14)g.lineTo(k,y+rnd(-5,5));g.stroke()});
});
const rainbowTex=()=>canvasTex(256,200,(g,w,h)=>{
  g.fillStyle='#d6ecff';g.fillRect(0,0,w,h);
  [['#e74c3c',90],['#f39c12',74],['#f7dc6f',58],['#58d68d',42],['#5dade2',26]].forEach(([c,r])=>{g.strokeStyle=c;g.lineWidth=15;g.beginPath();g.arc(w/2,h-30,r,Math.PI,0);g.stroke()});
  g.fillStyle='#fff';[[60,h-30],[w-60,h-30]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,24,0,7);g.arc(x+26,y+4,20,0,7);g.arc(x-24,y+6,18,0,7);g.fill()});
});
const clockTex=()=>canvasTex(256,256,(g,w)=>{
  g.fillStyle='#fff';g.beginPath();g.arc(128,128,126,0,7);g.fill();g.strokeStyle='#333';g.lineCap='round';
  for(let i=0;i<12;i++){const a=i*Math.PI/6;g.lineWidth=6;g.beginPath();g.moveTo(128+96*Math.sin(a),128-96*Math.cos(a));g.lineTo(128+116*Math.sin(a),128-116*Math.cos(a));g.stroke()}
  g.lineWidth=10;g.beginPath();g.moveTo(128,128);g.lineTo(128,60);g.stroke();g.lineWidth=8;g.beginPath();g.moveTo(128,128);g.lineTo(178,150);g.stroke();g.fillStyle='#c0392b';g.beginPath();g.arc(128,128,9,0,7);g.fill();
});
const letterTex=(l,bg)=>canvasTex(128,128,(g,w)=>{g.fillStyle=bg;g.fillRect(0,0,w,w);g.fillStyle='#fff';g.font='bold 86px Verdana';g.textAlign='center';g.textBaseline='middle';g.fillText(l,64,70)});
const caveTex=()=>canvasTex(256,256,(g,w)=>{
  g.clearRect(0,0,w,w);const gr=g.createRadialGradient(128,230,5,128,200,170);gr.addColorStop(0,'#ffcf85');gr.addColorStop(.35,'#7a4a72');gr.addColorStop(1,'#120d2e');
  g.fillStyle=gr;g.beginPath();g.moveTo(8,256);g.lineTo(8,120);g.quadraticCurveTo(8,8,128,8);g.quadraticCurveTo(248,8,248,120);g.lineTo(248,256);g.fill();
  g.fillStyle='#fff6b0';[[90,150,7],[160,120,5],[130,170,4],[190,170,6],[70,110,4]].forEach(([x,y,r])=>{g.globalAlpha=.9;g.beginPath();g.arc(x,y,r,0,7);g.fill()});g.globalAlpha=1;
});
const glowTex=canvasTex(128,128,(g,w)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,240,170,1)');gr.addColorStop(.3,'rgba(255,220,120,.55)');gr.addColorStop(1,'rgba(255,200,80,0)');g.fillStyle=gr;g.fillRect(0,0,w,w)});
const sparkTex=canvasTex(128,128,(g,w)=>{

  add(ted,new THREE.SphereGeometry(.05,16,12),fur2,0,.44,.11,{s:[1,.8,.8]});add(ted,new THREE.SphereGeometry(.015,10,8),dark,0,.455,.15);
  [[-1],[1]].forEach(([s])=>{add(ted,new THREE.ConeGeometry(.04,.07,3),std({color:0xd62d2d}),s*.045,.32,.15,{rz:s*-Math.PI/2})});
  add(ted,new THREE.SphereGeometry(.015,10,8),std({color:0xa31c1c}),0,.32,.15);
  ted.scale.setScalar(1.15);ted.position.set(R-.3,.55,0);ted.rotation.y=-Math.PI/2;tag(ted,'teddy');root.add(ted);
  // Pflanze + Bücherstapel
  add(root,new THREE.CylinderGeometry(.1,.07,.16,16),std({color:0xc7623a,roughness:.8}),R-.2,.08,1.55);
  [[0,.3,0],[.07,.25,.05],[-.07,.27,-.04],[.02,.22,-.08]].forEach(([x,h,z],i)=>add(root,new THREE.ConeGeometry(.04,.32,8),std({color:0x3b8a43,roughness:.8}),R-.2+x,.3+i*.02,1.55+z,{rz:x*3}));
  [['#2e86c1',.3],['#c0392b',.26],['#27ae60',.28]].forEach(([c,w],i)=>add(root,bx(w,.05,.2),std({color:c,roughness:.7}),R-.25,.025+i*.052,-1.55,{ry:i*.2}));

  /* ===== Decke: Lampe + Sterne ===== */
  add(root,new THREE.CylinderGeometry(.006,.006,.35,6),metal,0,H-.17,0,{cast:false});
  const lampM=new THREE.Mesh(new THREE.SphereGeometry(.2,24,18),new THREE.MeshBasicMaterial({color:0xfff0b8}));lampM.position.set(0,H-.45,0);root.add(lampM);tag(lampM,'stars');
  const lampGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.45}));lampGlow.scale.set(.55,.55,1);lampGlow.position.copy(lampM.position);root.add(lampGlow);
  const stM=c=>std({color:c,roughness:.5,emissive:c,emissiveIntensity:.08});
  [[-.9,-.7,.22,0xe53935],[.8,-.9,.12,0xe53935],[-.2,.9,.22,0xfbc02d],[-.9,.8,.12,0xfbc02d],[1.0,.5,.22,0x1e88e5],[.3,-1.2,.12,0x1e88e5]].forEach(([x,z,r,c])=>{const m=new THREE.Mesh(starGeo(r),stM(c));m.rotation.x=Math.PI/2;m.position.set(x,H-.02,z);m.castShadow=false;tag(m,'stars');root.add(m)});
  [[-1.5,-1.5],[1.4,-1.4],[-1.5,1.4],[1.5,1.5],[0,-1.7],[0,1.75],[-1.7,0],[1.7,.1]].forEach(([x,z],i)=>{const m=new THREE.Mesh(starGeo(.09+(i%3)*.03,.012),std({color:0xe9f2a0,roughness:.6,emissive:0xcfe070,emissiveIntensity:.35}));m.rotation.x=Math.PI/2;m.position.set(x,H-.01,z);root.add(m)});

  /* ===== Licht ===== */
  scene3.add(new THREE.HemisphereLight(0xfff1dc,0x8a6a4a,1.25));
  const lamp=new THREE.PointLight(0xffe0a0,10,0,2);lamp.position.set(0,H-.5,0);lamp.castShadow=true;lamp.shadow.mapSize.set(1024,1024);lamp.shadow.bias=-.003;lamp.shadow.normalBias=.03;lamp.shadow.radius=4;scene3.add(lamp);
  const moon=new THREE.SpotLight(0x9fb8ff,28,0,.7,.7,1.5);moon.position.set(R+1.4,2.3,.3);moon.target.position.set(-1,0,0);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);moon.shadow.bias=-.002;scene3.add(moon,moon.target);

  /* Funkel-Marker */
  addSpark('cave',0,1.78,bz+.9);addSpark('chest',-R+.62,.7,0);addSpark('door',.3,1.35,R-.2);addSpark('note',.8,1.7,R-.1,.2);addSpark('teddy',R-.4,1.3,.3);addSpark('stars',0,H-.18,.2,.3);
}

/* ----- Renderer, Kamera ----- */
function initGL(){
  try{
    renderer=new THREE.WebGLRenderer({antialias:true});
  }catch(e){glOK=false;view.innerHTML='<div style="padding:30px;font-size:22px">Dein Gerät kann das 3D-Zimmer leider nicht anzeigen. 😕 Probiere einen anderen Browser.</div>';return}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.outputColorSpace=THREE.SRGBColorSpace;
  view.insertBefore(renderer.domElement,view.firstChild);
  camera=new THREE.PerspectiveCamera(75,1,.05,50);camera.position.set(0,1.25,0);camera.rotation.order='YXZ';
  buildRoom();renderer.shadowMap.needsUpdate=true;
  layout();requestAnimationFrame(loop);
}
function layout(){
  if(!glOK)return;
  const w=view.clientWidth,h=view.clientHeight,asp=w/h;
  renderer.setSize(w,h);camera.aspect=asp;
  camera.fov=asp<1.25?Math.min(105,2*Math.atan(Math.tan(37*Math.PI/180)*1.25/asp)*180/Math.PI):74;
  camera.updateProjectionMatrix();apply();
}
function apply(){
  if(!camera)return;
  camera.rotation.y=-hd*Math.PI/180;camera.rotation.x=pt*Math.PI/180;
  updateMap();
}
function loop(t){
  t*=.001;
  Object.entries(sparks).forEach(([id,s])=>{const k=1+.25*Math.sin(t*3+s.userData.ph);s.scale.set(s.userData.base*k,s.userData.base*k,1)});
  Object.entries(glows).forEach(([id,g])=>{const on=g.userData.on;g.material.opacity=on?.55+.35*Math.sin(t*5):0;const k=.7+.25*Math.sin(t*5);g.scale.set(k,k,1)});
  renderer.render(scene3,camera);requestAnimationFrame(loop);
}
window.addEventListener('resize',layout);

/* ----- Steuerung: Ziehen = Kopf drehen, Tippen = anklicken ----- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function pickAt(cx,cy){
  const r=view.getBoundingClientRect();mouse.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(scene3.children,true);
  for(const h of hits){let o=h.object;while(o){if(o.userData&&o.userData.hs)return o.userData.hs;o=o.parent}if(h.object.isMesh&&h.object.material&&!h.object.material.transparent)return null}
  return null;
}
let drag=null,moved=false,tw=0;
view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,h:hd,p:pt};moved=false;cancelAnimationFrame(tw);hideHelp()});
window.addEventListener('pointermove',e=>{
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
    if(moved){const s=camera.fov/view.clientHeight;hd=drag.h-dx*s;pt=Math.max(-60,Math.min(80,drag.p+dy*s));apply();poke()}}
  else if(camera&&e.target===renderer.domElement){view.style.cursor=pickAt(e.clientX,e.clientY)?'pointer':'grab'}
});
window.addEventListener('pointerup',e=>{
  const d=drag;drag=null;if(!d||moved||!camera)return;
  if(e.target!==renderer.domElement)return;
  const id=pickAt(e.clientX,e.clientY);if(id){poke();ACT[id]()}
});
window.addEventListener('pointercancel',()=>drag=null);
function turnTo(h,p){
  hideHelp();cancelAnimationFrame(tw);
  h=hd+((((h-hd)%360)+540)%360-180);
  const h0=hd,p0=pt,t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/600),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;hd=h0+(h-h0)*e;pt=p0+(p-p0)*e;apply();if(k<1)tw=requestAnimationFrame(step)};
  tw=requestAnimationFrame(step);
}
$('#al').onclick=()=>turnTo(Math.round(hd/90)*90-90,pt);
$('#ar').onclick=()=>turnTo(Math.round(hd/90)*90+90,pt);
window.addEventListener('keydown',e=>{if($('#modal').classList.contains('on'))return;
  if(e.key==='ArrowLeft')$('#al').click();else if(e.key==='ArrowRight')$('#ar').click();
  else if(e.key==='ArrowUp')turnTo(hd,70);else if(e.key==='ArrowDown')turnTo(hd,-4)});
function hideHelp(){$('#help').style.opacity=0}

/* ---------- Karte ---------- */
const MAPB=[
 [1,0,'🛏️',0,-4,'w0'],[2,1,'🪟',90,-4,'w3'],[1,2,'🚪',180,-4,'w2'],[0,1,'🧸',270,-4,'w1'],[2,0,'⭐',null,72,'up'],[0,2,'⬇️',null,-50,'down']];
const mapEl=$('#map'),mapB={};
mapEl.append(...[...Array(9)].map(()=>el('div','c')));
MAPB.forEach(m=>{const b=el('button','',m[2]);b.style.gridColumn=m[0]+1;b.style.gridRow=m[1]+1;b.onclick=()=>{poke();turnTo(m[3]==null?hd:m[3],m[4])};mapEl.append(b);mapB[m[5]]=b});
mapEl.children[4].textContent='👀';
function updateMap(){
  const h=((hd%360)+360)%360,w=Math.round(h/90)%4;const key=['w0','w3','w2','w1'][w];
  Object.values(mapB).forEach(b=>b.classList.remove('here'));
  if(pt>45)mapB.up.classList.add('here');else if(pt<-40)mapB.down.classList.add('here');else mapB[key].classList.add('here');
}

/* ---------- Tipp-Glühen bei Stillstand ---------- */
let idle;
const WALLKEY={note:'w2',door:'w2',chest:'w1',cave:'w0',teddy:'w3',stars:'up'};
function poke(){clearTimeout(idle);updateHint(false);idle=setTimeout(()=>updateHint(true),40000)}
function updateHint(on){
  Object.values(mapB).forEach(b=>b.classList.remove('hint'));setGlow(null,false);
  if(!on)return;const c=cur();if(!c)return;setGlow(c[2],true);mapB[WALLKEY[c[2]]].classList.add('hint');
}

/* ---------- Fenster ---------- */
const modal=$('#modal');
function open(build,{closable=true}={}){
  modal.innerHTML='';const p=el('div','panel');modal.append(p);modal.classList.add('on');
  const close=()=>{modal.classList.remove('on');modal.innerHTML='';speechOn&&speechSynthesis&&speechSynthesis.cancel();poke()};
  if(closable){const x=el('button','close','✖');x.onclick=close;p.append(x)}
  build(p,close);return close;
}
function sayBox(txt,auto=true){const d=el('div','say');d.append(document.createTextNode(txt+' '));const b=el('button','spk','🔊');b.onclick=()=>say(txt);d.append(b);if(auto)setTimeout(()=>say(txt),350);return d}
function wrong(b){bad();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
function dots(n,i){const d=el('div','dots');for(let k=0;k<n;k++)d.append(el('i',k<i?'on':''));return d}
function blocked(msg){open((p,c)=>{p.append(el('div','pic','🤔'),sayBox(msg));const b=el('button','btn','Okay');b.onclick=c;p.append(b)})}

/* Belohnung mit Zettel (Hinweis, wohin als Nächstes) */
function reward({items=[],letter,zettel,after}){
  fanfareSoft();
  open((p,c)=>{
    p.append(el('h2','','🎉 Super gelöst!'));
    const r=el('div','row');
    items.forEach(i=>r.append(el('div','pic',i)));
    if(letter)r.append(el('div','bigl',letter));
    p.append(r);
    if(zettel){const n=el('div','note');n.append(sayBox(zettel));p.append(n)}
    const b=el('button','btn','Weiter ➜');b.onclick=()=>{c();after&&after()};p.append(b);
    refreshUI();
  },{closable:false});
}
const fanfareSoft=()=>beep([523,659,784,1047],.12);

/* ---------- Aktionen ---------- */
const ACT={
 note(){
  open((p,c)=>{
    p.append(el('h2','','📜 Ein Zettel'));
    const n=el('div','note');
    n.append(sayBox('Hallo! Die Tür ist zu. Zum Öffnen brauchst du ein Wort. Das Wort hat vier Buchstaben. Such sie im Zimmer! Fang bei der Spielzeugkiste an.'));
    p.append(n);
    const b=el('button','btn','Verstanden ➜');
    b.onclick=()=>{c();if(!S.note){S.note=1;refreshUI();setTimeout(()=>turnTo(270,-8),200)}};
    p.append(b);
  });
 },
 chest(){
  if(!S.note)return blocked('Die Kiste ist zugeschlossen. Lies erst den Zettel an der Tür.');
  if(S.chest)return blocked('Die Kiste ist schon offen. Du hast die Taschenlampe.');
  open((p,c)=>{
    p.append(el('h2','','🧸 Die Spielzeugkiste'));
    p.append(sayBox('Das Schloss will die Wörter. Tippe die Wörter in der Reihenfolge der Bilder.'));
    const pics=[['🐻','Bär'],['🍎','Apfel'],['🚗','Auto']];let n=0;
    const slots=el('div','row');const ss=pics.map(pc=>{const s=el('div','sl','<span class="pc">'+pc[0]+'</span>');slots.append(s);return s});
    p.append(slots);
    const tiles=el('div','row');
    shuffle([...pics.map(x=>x[1]),'Ball']).forEach(w=>{
      const b=el('button','tile',w);
      b.onclick=()=>{
        if(w===pics[n][1]){good();say(w);b.disabled=true;ss[n].innerHTML='<span class="pc">'+pics[n][0]+'</span><br>'+w;ss[n].classList.add('f');n++;
          if(n===3){setTimeout(()=>{c();S.chest=1;S.flash=1;S.letters=1;reward({items:['🔦'],letter:'M',zettel:'In der Kiste liegt eine Taschenlampe! Damit siehst du im Dunkeln. Krabbel in die Deckenhöhle auf dem Hochbett.'})},900)}}
        else wrong(b)};
      tiles.append(b);
    });
    p.append(tiles);
  });
 },
 cave(){
  if(!S.chest)return blocked('Hier ist es zu dunkel! Du brauchst eine Taschenlampe. Schau in der Spielzeugkiste.');
  if(S.cave)return blocked('Du warst schon in der Höhle. Der Teddy wartet am Fenster.');
  open((p,c)=>{
    p.append(el('h2','','⛺ In der Deckenhöhle'));
    p.append(sayBox('Es ist dunkel! Leuchte mit der Lampe. Tippe die Wörter von links nach rechts an.'));
    const sents=[['Der','Teddy','sitzt','am','Fenster.'],['Er','hat','etwas','im','Bauch.']];let si=0,wi=0;
    const dk=el('div','dark');const mask=el('div','mask');const lines=[];
    sents.forEach(s=>{const ln=el('div','line');s.forEach(w=>{const b=el('button','wd',w);b.dataset.w=w;ln.append(b)});lines.push(ln);dk.append(ln)});
    dk.append(mask);p.append(dk);
    const mv=e=>{const r=dk.getBoundingClientRect();dk.style.setProperty('--x',(e.clientX-r.left)+'px');dk.style.setProperty('--y',(e.clientY-r.top)+'px')};
    dk.addEventListener('pointermove',mv);dk.addEventListener('pointerdown',mv);
    dk.addEventListener('click',e=>{
      const b=e.target.closest('.wd');if(!b||b.classList.contains('found'))return;
      if(b===lines[si].children[wi]){good();b.classList.add('found');say(b.dataset.w.replace('.',''));wi++;
        if(wi>=sents[si].length){const full=sents[si].join(' ');setTimeout(()=>say(full),600);si++;wi=0;
          if(si>=sents.length)setTimeout(()=>{c();S.cave=1;S.letters=2;reward({letter:'O',zettel:'Der Teddy sitzt am Fenster. Er hat etwas im Bauch. Geh zum Fenster und weck ihn auf!'})},2600)}}
      else wrong(b)});
    requestAnimationFrame(()=>{const f=lines[0].children[0].getBoundingClientRect(),r=dk.getBoundingClientRect();dk.style.setProperty('--x',(f.left-r.left+f.width/2)+'px');dk.style.setProperty('--y',(f.top-r.top+f.height/2)+'px')});
  });
 },
 teddy(){
  if(!S.cave)return blocked('Der Teddy schläft ganz fest. Zzz … Vielleicht weiß jemand, wo er etwas versteckt hat?');
  if(S.teddy)return blocked('Der Teddy hat dir schon geholfen. Schau hoch zur Decke!');
  open((p,c)=>{
    p.append(el('h2','','🧸 Der Teddy'));
    p.append(sayBox('Ich bin wach! Setze die Silben zu einem Wort zusammen, dann mache ich meinen Bauch auf.'));
    const SY=[['🐰','Ha','se'],['👃','Na','se'],['🦉','Eu','le'],['🍰','Ku','chen'],['🕯️','Ker','ze']];
    const rounds=pick(SY,3);let i=0;
    const draw=()=>{
      const old=p.querySelector('.rd');old&&old.remove();
      const rd=el('div','rd');rd.style.cssText='display:flex;flex-direction:column;align-items:center;gap:14px';
      const [pic,a,b]=rounds[i];let step=0;
      const sl=el('div','row');const s1=el('div','sl'),s2=el('div','sl');sl.append(s1,s2);
      rd.append(dots(3,i),el('div','pic',pic),sl);
      const tl=el('div','row');
      const extra=pick(SY.filter(x=>x[0]!==pic).flatMap(x=>[x[1],x[2]]),1)[0];
      shuffle([a,b,extra]).forEach(t=>{
        const bt=el('button','tile',t);
        bt.onclick=()=>{
          if(t===(step?b:a)){good();say(t);bt.disabled=true;const s=step?s2:s1;s.textContent=t;s.classList.add('f',step?'s2':'s1');step++;
            if(step===2){setTimeout(()=>say(a+b),500);i++;setTimeout(()=>{if(i>=3){c();S.teddy=1;S.letters=3;reward({letter:'N',zettel:'Danke! Mein Bauch ist offen. Schau hoch zur Decke! Dort leuchten Sterne.'})}else draw()},1600)}}
          else wrong(bt)};
        tl.append(bt);
      });
      rd.append(tl);p.append(rd);
    };
    draw();
  });
 },
 stars(){
  if(!S.teddy)return blocked('Hoch oben leuchten Sterne. Aber du weißt noch nicht, was du dort tun sollst. Frag den Teddy am Fenster.');
  if(S.stars)return blocked('Die Sterne leuchten schön! Du hast schon alle Buchstaben. Geh zur Tür.');
  open((p,c)=>{
    p.append(el('h2','','⭐ Die Sterne'));
    const COL={'roten':'#ff4d4d','gelben':'#ffd43b','blauen':'#4dabf7'},SZ={'großen':1,'kleinen':.55};
    const pos=[[160,120],[400,90],[640,130],[200,330],[450,350],[690,320]];
    const combos=shuffle([['roten','großen'],['roten','kleinen'],['gelben','großen'],['gelben','kleinen'],['blauen','großen'],['blauen','kleinen']]);
    const targets=pick(combos,3);let i=0;
    const msg=el('div');p.append(msg);
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 800 450');svg.classList.add('stars');
    const dd=el('div');p.append(dd);
    combos.forEach((cb,k)=>{
      const pg=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      pg.setAttribute('points',STAR(pos[k][0]+60,pos[k][1]+50,70*SZ[cb[1]]+15));pg.setAttribute('fill',COL[cb[0]]);pg.setAttribute('stroke','#fff');pg.setAttribute('stroke-width','4');
      pg.onclick=()=>{
        const t=targets[i];
        if(cb===t){good();pg.setAttribute('opacity','.35');i++;if(i>=3)setTimeout(()=>{c();S.stars=1;S.letters=4;reward({letter:'D',zettel:'Alle Buchstaben sind da! Geh zur Tür und setze das Wort zusammen.'})},700);else show()}
        else wrong(pg)};
      svg.append(pg);
    });
    p.append(svg);
    function show(){msg.innerHTML='';const t=targets[i];msg.append(dots(3,i),sayBox(`Tippe auf den ${t[1]} ${t[0]} Stern.`))}
    show();
  });
 },
 door(){
  if(S.door)return;
  if(S.letters<4)return blocked(`Die Tür ist zu. Dir fehlen noch Buchstaben. Du hast schon ${S.letters} von 4. ${cur()[1]}`);
  open((p,c)=>{
    p.append(el('h2','','🔒 Das Schloss'));
    p.append(sayBox('Was leuchtet nachts am Himmel? Tippe die Buchstaben in der richtigen Reihenfolge.'));
    p.append(el('div','pic','🌙'));
    let n=0;const sl=el('div','row');const ss=[...WORD].map(()=>{const s=el('div','sl');s.style.minWidth='clamp(60px,12vmin,100px)';sl.append(s);return s});p.append(sl);
    const tl=el('div','row');
    shuffle([...WORD]).forEach(l=>{const b=el('button','tile',l);b.style.minWidth='clamp(64px,12vmin,100px)';
      b.onclick=()=>{if(l===WORD[n]){good();say(l);b.disabled=true;ss[n].textContent=l;ss[n].classList.add('f',n%2?'s2':'s1');n++;if(n===4)setTimeout(()=>{c();win()},900)}else wrong(b)};
      tl.append(b)});
    p.append(tl);
  });
 }
};
function win(){
  S.door=1;refreshUI();fanfare();
  open((p,c)=>{
    p.append(el('div','conf','🎉⭐🎉⭐🎉'),el('div','pic','🚪✨'),el('h2','','Die Tür ist offen! Du bist raus!'));
    p.append(sayBox('Geschafft! Du hast alle Rätsel gelesen und gelöst. Die Tür ist offen. Super gemacht!'));
    const b=el('button','btn','Nochmal spielen 🔁');b.onclick=()=>{c();startGame()};p.append(b);
  },{closable:false});
}

/* ---------- Start ---------- */
function startGame(){
  S=newState();refreshUI();hd=0;pt=-4;apply();
  $('#help').style.opacity=1;
  open((p,c)=>{
    p.classList.add('start');
    p.append(el('div','pic','🛏️🌙'),el('h1','','Kinderzimmer-Escape'));
    p.append(sayBox('Oh nein! Die Zimmertür ist zu. Schau dich im Zimmer um, lies die Hinweise und löse die Rätsel. Dann kommst du raus!'));
    const b=el('button','btn','Los geht’s! ▶');b.onclick=()=>{beep([440],.05);c();setTimeout(()=>say(cur()[1]),300)};p.append(b);
  },{closable:false});
  poke();
}
initGL();startGame();
